services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ulthra_website_app
    restart: unless-stopped
    ports:
      - "${PORT:-8383}:80"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend

  # Optional containerized Vite HMR dev server:
  # Run with: docker compose --profile dev up
  dev:
    image: node:22-alpine
    container_name: ulthra_website_dev
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${DEV_PORT:-4321}:4321"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    networks:
      - frontend

volumes:
  dev_node_modules:

networks:
  frontend:
    driver: bridge

