    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF8F5" />
    <script>
      (function () {
        var mode = 'auto';
        try {
          var params = new URLSearchParams(window.location.search);
          var q = params.get('theme');
          if (q === 'light' || q === 'dark' || q === 'auto') {
            mode = q;
            sessionStorage.setItem('gemx-theme-mode', q);
          } else {
            var saved = sessionStorage.getItem('gemx-theme-mode');
            if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved;
          }
        } catch (e) {}
        var hour = new Date().getHours();
        var resolved = mode === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : mode;
        document.documentElement.dataset.theme = resolved;
        var cs = document.querySelector('meta[name="color-scheme"]');
        if (cs) cs.content = resolved;
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.content = resolved === 'dark' ? '#071128' : '#FAF8F5';
      })();
    </script>
